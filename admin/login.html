<!DOCTYPE html><html lang="en"><head><title>Admin Login | Cellz Creative Studio</title>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{fontFamily:{sans:["DM Sans","sans-serif"],display:["Space Grotesk","sans-serif"]}}}}</script></head>
<body class="bg-gray-50 text-black font-sans antialiased min-h-screen flex items-center justify-center px-6 selection:bg-black selection:text-white">
<div class="w-full max-w-md">
 <div class="text-center mb-8"><div class="inline-flex flex-col font-display font-extrabold text-lg tracking-tighter leading-none"><span>CELLZ</span><span class="text-xs tracking-widest text-gray-500">CREATIVE</span><span class="text-xs tracking-widest">STUDIO</span></div>
 <p class="text-xs font-bold uppercase tracking-widest text-gray-400 mt-6">Admin Portal</p>
 <h1 class="font-display text-4xl font-extrabold tracking-tight mt-2">WELCOME BACK</h1></div>
 <div class="bg-white border border-gray-200 rounded-2xl p-8 shadow-sm space-y-5">
  <div class="space-y-2"><label class="text-xs uppercase font-bold tracking-wider text-gray-600">Username</label>
   <input id="u" autocomplete="username" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:border-black transition-colors"></div>
  <div class="space-y-2"><label class="text-xs uppercase font-bold tracking-wider text-gray-600">Password</label>
   <input id="p" type="password" autocomplete="current-password" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:border-black transition-colors" onkeydown="if(event.key==='Enter')go()"></div>
  <p id="err" class="text-sm text-red-600 hidden"></p>
  <button onclick="go()" class="w-full py-4 bg-black text-white font-medium rounded-lg hover:bg-gray-800 transition-colors shadow-lg">Log In</button>
 </div>
 <p class="text-center mt-6"><a href="/" class="text-xs text-gray-500 hover:text-black">← Back to portfolio</a></p>
</div>
<script>
async function go(){
 const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});
 if(r.ok)location='/admin/dashboard';
 else{const d=await r.json().catch(()=>({}));err.textContent=d.error||'Login failed';err.classList.remove('hidden')}
}
</script></body></html>
